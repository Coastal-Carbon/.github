# Reusable workflow: call it from any hum.ai repo with
#   jobs:
#     check:
#       uses: Coastal-Carbon/.github/.github/workflows/pr-description.yml@main
# on pull_request events (opened, edited, synchronize, reopened).
#
# One job, two steps, so a repo has one status check to require. The second
# step runs even when the first fails, so both results show in the log.
name: PR description

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-description:
    name: PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Coastal-Carbon/.github
          ref: main
          path: dot-github
      - name: Human summary above the separator
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 dot-github/scripts/check_pr_body.py --author-type "${{ github.event.pull_request.user.type }}"
      - name: AGENTS.md present, CLAUDE.md imports it
        if: always()
        run: python3 dot-github/scripts/check_agent_files.py .
